<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var stored = localStorage.getItem('innodel-color-scheme');
				var meta = document.querySelector('meta[name="color-scheme"]');
				if (stored === 'light' || stored === 'dark') {
					if (meta) meta.setAttribute('content', stored);
					document.documentElement.dataset.theme = stored;
				} else {
					if (meta) meta.setAttribute('content', 'light dark');
					delete document.documentElement.dataset.theme;
				}
			} catch (_) {}
		</script>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
